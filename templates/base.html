<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FULAER HR</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f4f6f9}.navbar{background:#172b4d}.brand{color:#d8b56d!important;font-weight:700}.card{border:0;box-shadow:0 2px 12px #172b4d12}.btn-gold{background:#b28b42;color:white}.btn-gold:hover{background:#987331;color:white}</style></head><body>
<nav class="navbar navbar-expand-lg navbar-dark"><div class="container"><a class="navbar-brand brand" href="{{url_for('dashboard')}}">FULAER HR SYSTEM</a>{% if me %}<div class="navbar-nav ms-auto flex-row gap-3"><a class="nav-link" href="{{url_for('dashboard')}}">หน้าหลัก</a>{% if me.role=='admin' %}<a class="nav-link" href="{{url_for('employees')}}">พนักงาน</a><a class="nav-link" href="{{url_for('attendance')}}">ลงเวลา</a><a class="nav-link" href="{{url_for('payroll')}}">เงินเดือน</a>{% endif %}<a class="nav-link" href="{{url_for('logout')}}">ออกจากระบบ</a></div>{% endif %}</div></nav>
<main class="container py-4">{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="alert alert-{{cat}}">{{msg}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
